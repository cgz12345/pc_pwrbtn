<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="100%" height="100%" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <!-- 渐变底色与面板阴影 -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151b28"/>
      <stop offset="100%" stop-color="#0e131f"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- 各种线缆的末端箭头标记 -->
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 顶部主标题 -->
  <text x="560" y="38" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700" letter-spacing="1.2">ESP32 电脑远程开机与硬件回读 · 实物引脚接线示意图</text>
  <text x="560" y="62" text-anchor="middle" fill="#94a3b8" font-size="12">主板 USB 9-Pin (1转2) 待机取电 ── 前面板 F_PANEL (9-Pin) 信号传输与真机状态回读</text>

  <!-- ==================== 区域 1：主板 USB 9-Pin 待机供电与 1转2 分线器 ==================== -->
  <g transform="translate(35, 90)">
    <rect width="335" height="265" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="335" height="38" rx="12" fill="#1e293b"/>
    <text x="16" y="24" fill="#38bdf8" font-size="14" font-weight="600">⚡ 1. 待机取电：主板 USB 2.0 (9-Pin)</text>

    <!-- 9-pin 排针引脚定义图 (俯视图) -->
    <g transform="translate(18, 50)">
      <rect width="135" height="66" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="67" y="16" text-anchor="middle" fill="#94a3b8" font-size="9.5">主板 USB 9-Pin 原座</text>
      <!-- 上排 5 针 (奇数排) -->
      <circle cx="20" cy="30" r="5" fill="#f43f5e"/><text x="20" y="33" text-anchor="middle" fill="#fff" font-size="7">1</text>
      <circle cx="43" cy="30" r="4" fill="#64748b"/>
      <circle cx="66" cy="30" r="4" fill="#64748b"/>
      <circle cx="89" cy="30" r="5" fill="#94a3b8"/><text x="89" y="33" text-anchor="middle" fill="#000" font-size="7">7</text>
      <circle cx="112" cy="30" r="3" fill="#334155"/>
      <!-- 下排 4 针 (偶数排，第10针缺失作为防呆Key) -->
      <circle cx="20" cy="48" r="5" fill="#f43f5e"/><text x="20" y="51" text-anchor="middle" fill="#fff" font-size="7">2</text>
      <circle cx="43" cy="48" r="4" fill="#64748b"/>
      <circle cx="66" cy="48" r="4" fill="#64748b"/>
      <circle cx="89" cy="48" r="5" fill="#94a3b8"/><text x="89" y="51" text-anchor="middle" fill="#000" font-size="7">8</text>
      <rect x="108" y="44" width="8" height="8" fill="#1e293b" stroke="#334155" stroke-dasharray="1,1"/>
    </g>

    <!-- 1转2 扩展线卡片 -->
    <g transform="translate(168, 50)">
      <rect width="150" height="66" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,2"/>
      <text x="75" y="22" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">USB 9-Pin 1转2线</text>
      <text x="75" y="40" text-anchor="middle" fill="#cbd5e1" font-size="9.5">主板插针 1 口扩展为 2 口</text>
      <text x="75" y="54" text-anchor="middle" fill="#94a3b8" font-size="9">保留机箱原有前置面板功能</text>
    </g>

    <!-- 1分2 两条支路 -->
    <path d="M 85 125 L 85 142 L 40 142 L 40 162" fill="none" stroke="#64748b" stroke-width="1.2"/>
    <rect x="15" y="162" width="140" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="85" y="179" text-anchor="middle" fill="#cbd5e1" font-size="10.5" font-weight="500">支路 A: 机箱前面板</text>
    <text x="85" y="195" text-anchor="middle" fill="#64748b" font-size="9">原装 USB 2.0 照常插用</text>

    <path d="M 242 125 L 242 142 L 242 162" fill="none" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="168" y="162" width="150" height="42" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="243" y="179" text-anchor="middle" fill="#f43f5e" font-size="10.5" font-weight="600">支路 B: ESP32 取电</text>
    <text x="243" y="195" text-anchor="middle" fill="#94a3b8" font-size="9">取 Pin 1(+5V) 与 Pin 7(GND)</text>

    <text x="16" y="228" fill="#e2e8f0" font-size="10.5">📌 <b>取电原理</b>：电脑关机后 USB 保持 +5VSB 待机供电。</text>
    <text x="16" y="246" fill="#94a3b8" font-size="10">* BIOS 需确保<b>关闭 ErP/EuP</b>，避免关机切断 5VSB 电源轨。</text>
  </g>

  <!-- ==================== 区域 2：主板前面板 F_PANEL 信号传输 ==================== -->
  <g transform="translate(35, 375)">
    <rect width="335" height="315" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="335" height="38" rx="12" fill="#1e293b"/>
    <text x="16" y="24" fill="#a855f7" font-size="14" font-weight="600">🔌 2. 信号回读：前面板排针 (F_PANEL)</text>

    <!-- F_PANEL 排针定义图 -->
    <g transform="translate(18, 50)">
      <rect width="300" height="114" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="150" y="18" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">标准 Intel 9-Pin F_PANEL 接口定义</text>

      <!-- 上排 -->
      <g transform="translate(32, 38)" font-size="9" text-anchor="middle">
        <circle cx="10" cy="8" r="6" fill="#475569"/><text x="10" y="11" fill="#fff">1</text>
        <text x="10" y="25" fill="#64748b">HD+</text>

        <circle cx="62" cy="8" r="6" fill="#c084fc"/><text x="62" y="11" fill="#fff">3</text>
        <text x="62" y="25" fill="#c084fc" font-weight="700">HD-</text>

        <circle cx="120" cy="8" r="6" fill="#f59e0b"/><text x="120" y="11" fill="#fff">5</text>
        <text x="120" y="25" fill="#f59e0b" font-weight="700">RST</text>

        <circle cx="176" cy="8" r="6" fill="#f59e0b"/><text x="176" y="11" fill="#fff">7</text>
        <text x="176" y="25" fill="#f59e0b">RST</text>

        <circle cx="230" cy="8" r="5" fill="#334155"/><text x="230" y="25" fill="#64748b">NC</text>
      </g>

      <!-- 下排 -->
      <g transform="translate(32, 75)" font-size="9" text-anchor="middle">
        <circle cx="10" cy="8" r="6" fill="#475569"/><text x="10" y="11" fill="#fff">2</text>
        <text x="10" y="25" fill="#64748b">PWR+</text>

        <circle cx="62" cy="8" r="6" fill="#38bdf8"/><text x="62" y="11" fill="#fff">4</text>
        <text x="62" y="25" fill="#38bdf8" font-weight="700">PLED-</text>

        <circle cx="120" cy="8" r="6" fill="#10b981"/><text x="120" y="11" fill="#fff">6</text>
        <text x="120" y="25" fill="#10b981" font-weight="700">PWR</text>

        <circle cx="176" cy="8" r="6" fill="#10b981"/><text x="176" y="11" fill="#fff">8</text>
        <text x="176" y="25" fill="#10b981">PWR</text>

        <rect x="226" y="4" width="8" height="8" fill="#1e293b" stroke="#334155" stroke-dasharray="1,1"/>
        <text x="230" y="25" fill="#64748b">KEY</text>
      </g>
    </g>

    <!-- 接线操作要点 -->
    <g transform="translate(18, 175)" font-size="11" fill="#cbd5e1">
      <rect width="300" height="125" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" fill="#10b981" font-weight="600">✔ 无损背插并联：</text>
      <text x="12" y="38" fill="#94a3b8" font-size="10">原机箱前面板插头保持插在主板排针上不动；</text>
      <text x="12" y="54" fill="#94a3b8" font-size="10">剥出镀锡杜邦线铜芯，插入插头背面金属弹片缝隙缠紧。</text>

      <text x="12" y="76" fill="#38bdf8" font-weight="600">✔ 关键：为什么必须接负极（-）而非正极（+）？</text>
      <text x="12" y="94" fill="#94a3b8" font-size="10">主板 PLED+ 在关机时仍供 3.3V 待机电（接+必误判开机）；</text>
      <text x="12" y="110" fill="#94a3b8" font-size="10">主板通过南桥下拉负极（0V开机/3.3V关机），故必须接负极！</text>
    </g>
  </g>

  <!-- ==================== 区域 3：ESP32 核心控制器 ==================== -->
  <g transform="translate(440, 130)">
    <rect width="250" height="505" rx="16" fill="url(#chipGrad)" stroke="#10b981" stroke-width="1.8" filter="url(#subtleGlow)"/>
    <rect x="0" y="0" width="250" height="46" rx="16" fill="#10b981" fill-opacity="0.15"/>
    <text x="125" y="28" text-anchor="middle" fill="#34d399" font-size="15" font-weight="700">⚡ ESP32-S3 / C3 核心</text>

    <!-- 开漏保护徽章 -->
    <rect x="15" y="58" width="220" height="66" rx="8" fill="#0b0f19" stroke="#059669" stroke-width="1"/>
    <text x="25" y="78" fill="#10b981" font-size="11" font-weight="700">🛡️ 硬件开漏保护 (Open-Drain)</text>
    <text x="25" y="96" fill="#94a3b8" font-size="10">平时高阻浮空，不向主板倒灌电流；</text>
    <text x="25" y="112" fill="#94a3b8" font-size="10">触发时仅下拉接地，原机箱按键完全正常。</text>

    <!-- 引脚连接卡片 -->
    <g transform="translate(15, 138)" font-size="12">
      <!-- 5V 供电 -->
      <rect x="0" y="0" width="220" height="38" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2"/>
      <circle cx="16" cy="19" r="5" fill="#f43f5e"/>
      <text x="28" y="23" fill="#f43f5e" font-weight="700">5V / VIN</text>
      <text x="95" y="23" fill="#cbd5e1" font-size="11">← 来自 USB 9Pin (+5VSB)</text>

      <!-- GND 地线 -->
      <rect x="0" y="46" width="220" height="38" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1"/>
      <circle cx="16" cy="65" r="5" fill="#94a3b8"/>
      <text x="28" y="69" fill="#cbd5e1" font-weight="700">GND</text>
      <text x="95" y="69" fill="#94a3b8" font-size="11">← 与主板天然共地</text>

      <!-- GPIO 4 (开漏控制电源) -->
      <rect x="0" y="98" width="220" height="38" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="16" cy="117" r="5" fill="#10b981"/>
      <text x="28" y="121" fill="#10b981" font-weight="700">GPIO 4</text>
      <text x="90" y="121" fill="#6ee7b7" font-size="10.5">→ 并联 POWER_SW (开关)</text>

      <!-- GPIO 5 (开漏控制复位) -->
      <rect x="0" y="144" width="220" height="38" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <circle cx="16" cy="163" r="5" fill="#f59e0b"/>
      <text x="28" y="167" fill="#f59e0b" font-weight="700">GPIO 5</text>
      <text x="90" y="167" fill="#fcd34d" font-size="10.5">→ 并联 RESET_SW (复位)</text>

      <!-- GPIO 6 (检测电源灯) -->
      <rect x="0" y="190" width="220" height="38" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="16" cy="209" r="5" fill="#38bdf8"/>
      <text x="28" y="213" fill="#38bdf8" font-weight="700">GPIO 6</text>
      <text x="90" y="213" fill="#7dd3fc" font-size="10.5">← 弱上拉接 PLED- (开机)</text>

      <!-- GPIO 7 (检测硬盘灯) -->
      <rect x="0" y="236" width="220" height="38" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.2"/>
      <circle cx="16" cy="255" r="5" fill="#c084fc"/>
      <text x="28" y="259" fill="#c084fc" font-weight="700">GPIO 7</text>
      <text x="90" y="259" fill="#d8b4fe" font-size="10.5">← 弱上拉接 HDLED- (硬盘)</text>
    </g>

    <!-- 蓝牙天线卡 -->
    <rect x="15" y="445" width="220" height="42" rx="8" fill="#0b0f19" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="125" y="471" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-weight="600">📶 板载蓝牙 BLE 全量无线治理</text>
  </g>

  <!-- ==================== 区域 4：云端与手机终端 ==================== -->
  <g transform="translate(760, 90)">
    <rect width="325" height="600" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="325" height="38" rx="12" fill="#1e293b"/>
    <text x="16" y="24" fill="#a78bfa" font-size="14" font-weight="600">☁️ 3. 极速云端通信与手机控制</text>

    <!-- MQTT Broker 卡片 -->
    <g transform="translate(16, 52)">
      <rect width="293" height="110" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="14" y="26" fill="#c4b5fd" font-size="13" font-weight="700">EMQX 国内高可用极速节点</text>
      <text x="14" y="48" fill="#e2e8f0" font-size="11">broker-cn.emqx.io (8883 TLS / 8084 WSS)</text>
      <text x="14" y="72" fill="#34d399" font-size="11.5" font-weight="600">⚡ 国内直连 15ms 握手，无感低延迟</text>
      <text x="14" y="94" fill="#94a3b8" font-size="10">专属 Topic 隔离控制：命令与状态双向互锁</text>
    </g>

    <!-- 手机 Web App 卡片 -->
    <g transform="translate(16, 178)">
      <rect width="293" height="235" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
      <text x="14" y="26" fill="#6ee7b7" font-size="13" font-weight="700">📱 手机独立 Web App 控制台 (PWA)</text>
      <text x="14" y="50" fill="#cbd5e1" font-size="11.5">• <b>沉浸式深色玻璃拟态</b>，支持加到手机主屏</text>
      <text x="14" y="76" fill="#cbd5e1" font-size="11.5">• <b>真机电源大光环</b>：开机绿环呼吸，关机灰环</text>
      <text x="14" y="102" fill="#cbd5e1" font-size="11.5">• <b>硬盘电平镜像</b>：物理灯亮黄灯点亮，关机互锁</text>
      <text x="14" y="128" fill="#cbd5e1" font-size="11.5">• <b>三重安全确认</b>：关机/强关/重启均防误触</text>
      <text x="14" y="154" fill="#cbd5e1" font-size="11.5">• <b>4.5s 智能强关</b>：断电自动松开防二次开机</text>
      <text x="14" y="180" fill="#38bdf8" font-size="11">• <b>内置蓝牙抽屉</b>：扫码配置引脚与网络</text>
      <rect x="14" y="198" width="265" height="24" rx="4" fill="#1e293b"/>
      <text x="146" y="214" text-anchor="middle" fill="#94a3b8" font-size="10">本地桌面已有单文件，微信传输或手机扫码即用</text>
    </g>

    <!-- 手机蓝牙配网卡片 -->
    <g transform="translate(16, 430)">
      <rect width="293" height="150" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="14" y="24" fill="#38bdf8" font-size="12.5" font-weight="700">📲 手机近场蓝牙配置 (免重新烧录)</text>
      <text x="14" y="46" fill="#94a3b8" font-size="10.5">使用 LightBlue / nRF Connect 搜索 <b>pc_pwrbtn</b></text>
      <text x="14" y="66" fill="#cbd5e1" font-size="11">向配置特征写入 JSON 参数（安全口令 831742）：</text>
      <rect x="14" y="78" width="265" height="34" rx="4" fill="#020617" stroke="#334155" stroke-width="0.8"/>
      <text x="20" y="99" fill="#fcd34d" font-family="monospace" font-size="9.5">{"pin":"831742","pwr":4,"rst":5,"pled":6,"hdled":7}</text>
      <text x="14" y="132" fill="#94a3b8" font-size="10">写入后 3 秒自动重启生效，彻底无需重新插线烧录</text>
    </g>
  </g>

  <!-- ==================== 连线 (实物走向) ==================== -->
  <!-- 5V 供电线 (红) -->
  <path d="M 318 272 L 380 272 L 380 252 L 440 252" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arr-red)"/>
  <!-- 地线 GND (灰) -->
  <path d="M 318 292 L 392 292 L 392 298 L 440 298" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-gray)"/>

  <!-- GPIO 4 -> PWR (绿) -->
  <path d="M 440 350 L 390 350 L 390 535 L 210 535" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <!-- GPIO 5 -> RST (橙) -->
  <path d="M 440 396 L 400 396 L 400 498 L 210 498" fill="none" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <!-- PLED- -> GPIO 6 (蓝) -->
  <path d="M 115 535 L 115 478 L 410 478 L 410 442 L 440 442" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- HDLED- -> GPIO 7 (紫) -->
  <path d="M 115 498 L 115 466 L 420 466 L 420 488 L 440 488" fill="none" stroke="#c084fc" stroke-width="1.8" marker-end="url(#arr-purple)"/>

  <!-- ESP32 <-> 云端 双向通信 -->
  <path d="M 690 240 L 760 240" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <path d="M 760 262 L 690 262" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
</svg>